name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool xclip fonts-dejavu-core
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: End to end, with a stand-in for the Proton Drive CLI
        run: sh tests/xvfb.sh target/release/niruprodrive
      - run: bash -n install.sh && bash -n uninstall.sh
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --locked
