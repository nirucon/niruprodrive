name: Release
on:
  push: { tags: ['v*'] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: x86_64-unknown-linux-musl }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools fonts-dejavu-core
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # A static binary: runs on Debian, Arch and Void alike.
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Identity
        run: test "$(./target/x86_64-unknown-linux-musl/release/niruprodrive --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/niruprodrive dist/
          (cd dist && sha256sum niruprodrive > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/niruprodrive
            dist/SHA256SUMS
          generate_release_notes: true
